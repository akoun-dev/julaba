<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121319">
  <title>Jùlaba — hors connexion</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; background: #fafaf7; color: #20231f; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
    main { max-width: 420px; text-align: center; }
    h1 { font-size: 1.6rem; margin-bottom: 12px; }
    p { line-height: 1.5; color: #50554e; }
    .state { display: inline-flex; gap: 8px; align-items: center; border-radius: 999px; padding: 8px 14px; background: #fff1c2; color: #714f00; font-weight: 600; }
    button { border: 0; border-radius: 10px; padding: 12px 18px; background: #1f6b45; color: white; font: inherit; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <div class="state" role="status"><span aria-hidden="true">●</span> Hors connexion</div>
    <h1>Jùlaba est momentanément inaccessible</h1>
    <p>Reconnectez-vous pour charger l’application. Les opérations déjà enregistrées sur cet appareil seront synchronisées dès le retour du réseau.</p>
    <button type="button" onclick="location.reload()">Réessayer</button>
  </main>
</body>
</html>
