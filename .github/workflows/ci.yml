name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint + Typecheck + Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # MODE-1005 (AUDIT-012 P2) : aucun nouveau secret dans l'arbre suivi
      # (PAT ghp_, sbp_, clés live, clés privées) — 7 motifs haut signal.
      - name: Scan secrets (AUDIT-012 P2)
        run: bash scripts/scan-secrets.sh

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests (vitest)
        run: bun run test

  build:
    name: Build production (AUDIT-012 P1-11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Build réalisé avec les valeurs d'exemple (.env.example) : aucune
      # real key en CI — seul l'ARTEFACT et sa compilabilité sont validés.
      - name: Préparer l'environnement (placeholders)
        run: cp .env.example .env

      - name: Build Next.js production
        run: bun run build

      - name: Archiver l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next/standalone
          retention-days: 7

  pgtap:
    name: Tests pgTAP (schéma Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Démarrer la stack Supabase locale
        run: supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector,storage-api

      # `db reset` applique TOUTES les migrations dans l'ordre : ce job
      # constitue donc aussi la vérification de migration (AUDIT-012 P1-11) —
      # une migration cassée ou un drift SQL fait échouer la CI.
      - name: Appliquer migrations + seed
        run: supabase db reset --local

      - name: Tests pgTAP (tous les fichiers supabase/tests/)
        run: supabase test db
