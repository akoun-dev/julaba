name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint + Typecheck + Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests (vitest)
        run: bun run test

  pgtap:
    name: Tests pgTAP (schéma Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Démarrer la stack Supabase locale
        run: supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector,storage-api

      - name: Appliquer migrations + seed
        run: supabase db reset --local

      - name: Tests pgTAP (rls, stock, cooperative, acl)
        run: supabase test db
